<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LorePDF – Discover novels and keep reading</title>
  <meta name="description" content="Discover novels, follow series part by part, and read in one tap.">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="site-header">
    <a class="logo" href="index.html">Lore<span>PDF</span></a>
    <a class="header-link" href="#trending">Trending</a>
  </header>

  <main>
    <section class="hero">
      <h1>Your next novel is one tap away.</h1>
      <p>Browse stories, follow a series from part one to the last, and pick up right where you left off.</p>
      <a class="btn btn-primary" href="#recommended">Browse novels</a>
    </section>

    <section class="section" id="recommended">
      <div class="section-head">
        <h2>Recommended</h2>
        <div class="arrows">
          <button class="arrow" id="carouselPrev" aria-label="Scroll left">&#8249;</button>
          <button class="arrow" id="carouselNext" aria-label="Scroll right">&#8250;</button>
        </div>
      </div>
      <div class="carousel" id="recommendedCarousel"></div>
    </section>

    <section class="section" id="trending">
      <div class="section-head"><h2>Trending books</h2></div>
      <div class="grid" id="trendingGrid"></div>
    </section>
  </main>

  <footer class="site-footer">&copy; <span id="year"></span> LorePDF</footer>
  <script src="script.js"></script>
</body>
</html>
