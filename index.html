<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorePDF – Discover your next novel</title>
<meta name="description" content="Browse, search and read novels and complete series on LorePDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="app-header"></div>
<main>
  <section class="hero wrap">
    <div class="hero-text">
      <h1>Every great story, one library.</h1>
      <p>Explore fantasy epics, mysteries and complete series. Find a novel, open it, and continue straight to the next part.</p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="#browse">Start exploring</a>
        <button class="btn btn-ghost" data-open-search>Search novels</button>
      </div>
    </div>
    <div class="hero-covers" id="heroCovers" aria-hidden="true"></div>
  </section>

  <section class="wrap sec">
    <div class="sec-head"><h2>Recommended for you</h2>
      <div class="arrows"><button class="arrow" data-dir="-1" aria-label="Previous">‹</button><button class="arrow" data-dir="1" aria-label="Next">›</button></div>
    </div>
    <div class="carousel" id="recommended"></div>
  </section>

  <section class="trend-band sec">
    <div class="wrap">
      <div class="sec-head"><h2>Trending now</h2></div>
      <div class="trend-list" id="trending"></div>
    </div>
  </section>

  <section class="wrap sec" id="browse">
    <div class="sec-head"><h2>Browse by category</h2></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="browseGrid"></div>
  </section>
</main>
<div id="app-footer"></div>
<script src="script.js"></script>
</body>
</html>
